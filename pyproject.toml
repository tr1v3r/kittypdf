[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kittypdf"
version = "0.3.0"
description = "A minimal PDF reader for the kitty terminal: vim keys, kitty graphics protocol"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24"]

[project.scripts]
kittypdf = "kittypdf.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kittypdf"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "SIM105", # try/except/pass cleanup paths are intentional in terminal teardown
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM115"] # test temp files don't need context managers

[tool.coverage.run]
source = ["src/kittypdf"]

[tool.coverage.report]
show_missing = true
# term.py raw-mode/termios setup is exercised by the real-kitty smoke test,
# not unit tests; the floor guards regressions in the logic-heavy modules.
fail_under = 75
