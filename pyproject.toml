[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kittypdf"
version = "0.2.0"
description = "A minimal PDF reader for the kitty terminal: vim keys, kitty graphics protocol"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24"]

[project.scripts]
kittypdf = "kittypdf.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kittypdf"]
