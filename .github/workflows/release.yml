name: Release

# Tag-gated publish. Uses PyPI Trusted Publishing: configure the trusted
# publisher once at https://pypi.org/manage/account/publishing/ for
# repo tr1v3r/kittypdf, workflow release.yml, environment pypi.
# Until that is configured, only the GitHub Release with artifacts is created.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-dist:
    name: Smoke-test wheel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install dist/*.whl
      - run: python -c "import kittypdf.app, kittypdf.graphics, kittypdf.render, kittypdf.term, kittypdf.toc; print('dist ok')"

  github-release:
    name: Create GitHub Release
    needs: [build, test-dist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

  pypi:
    name: Publish to PyPI (Trusted Publishing)
    needs: [build, test-dist]
    # Flip to true after configuring the trusted publisher on PyPI.
    if: false
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
